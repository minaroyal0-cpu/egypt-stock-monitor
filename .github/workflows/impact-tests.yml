name: EGX Impact Tests

on:
  push:
    branches:
      - feature/egx-impact-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run impact screening tests
        run: python -m unittest discover -s tests -v
