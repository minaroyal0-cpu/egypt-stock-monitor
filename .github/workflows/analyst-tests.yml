name: EGX Analyst Tests

on:
  push:
    branches:
      - feature/egx-full-analyst-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyst-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run analyst unit tests
        run: python -m unittest discover -s tests -v
